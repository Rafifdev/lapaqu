<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/lapaqu-logo.png" />
    <link rel="apple-touch-icon" href="/lapaqu-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lapaqu — POS SaaS & Customer Self-Order</title>
    <script>
      (function() {
        try {
          const pref = localStorage.getItem('lapaqu_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (pref === 'dark' || ((!pref || pref === 'system') && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Local Font: Roboto Flex loaded via src/style.css -->
    <!-- Google Icons: Material Symbols Rounded -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  </head>
  <body class="font-sans antialiased text-[#1E293B] dark:text-[#F8FAFC] bg-[#F5F6FA] dark:bg-[#1B2431] min-h-screen transition-colors duration-200 selection:bg-[#4880FF]/20 selection:text-[#4880FF]">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
